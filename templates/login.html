<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Emergency Core Login</title>
    <style>
        body { background-color: #111827; color: #ffffff; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; display: flex; align-items: center; justify-content: center; min-height: min-content; height: 100vh; margin: 0; }
        .login-card { background-color: #1f2937; padding: 40px; rounded-radius: 12px; border: 1px solid #374151; box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3); width: 100%; max-width: 400px; border-radius: 12px; }
        h2 { font-size: 24px; font-weight: bold; text-align: center; margin-top: 0; margin-bottom: 24px; color: #34d399; }
        .form-group { margin-bottom: 16px; }
        label { block: block; color: #9ca3af; margin-bottom: 6px; font-size: 14px; display: block; }
        input { width: 100%; padding: 10px; background-color: #374151; border: 1px solid #4b5563; border-radius: 6px; color: white; outline: none; box-sizing: border-box; }
        input:focus { border-color: #10b981; }
        button { w-full: w-full; width: 100%; background-color: #059669; color: white; padding: 12px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 16px; transition: 0.2s; }
        button:hover { background-color: #047857; }
    </style>
</head>
<body>
    <div class="login-card">
        <h2>🏥 Emergency System Login</h2>
        <form action="/login" method="POST">
            <div class="form-group">
                <label>Username</label>
                <input type="text" name="username" required>
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" name="password" required>
            </div>
            <button type="submit">Sign In</button>
        </form>
    </div>
</body>
</html>
